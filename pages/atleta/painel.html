<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Painel · TeamGestor</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../assets/css/variables.css" />
        <link rel="stylesheet" href="../../assets/css/reset.css" />
        <link rel="stylesheet" href="../../assets/css/base.css" />
        <link rel="stylesheet" href="../../assets/css/atleta.css" />
        <link rel="stylesheet" href="../../assets/css/layout.css" />
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="conteudo">
                <div class="topo">
                    <div>
                        <h1 id="ola"></h1>
                        <p class="sub" id="time"></p>
                    </div>
                    <button class="btn">💬 Justificar ausência</button>
                </div>
                <div
                    class="card"
                    id="prox"
                    style="display: flex; gap: 16px; align-items: center"
                ></div>
                <div class="grid mt" style="grid-template-columns: 1.4fr 1fr">
                    <div class="card">
                        <h3>Minha agenda:</h3>
                        <div id="agenda"></div>
                    </div>
                    <div>
                        <div class="card">
                            <h3>Plano de treino para a semana:</h3>
                            <p class="sub mt">
                                Foco em finalização e resistência. 4 sessões previstas até sábado.
                            </p>
                        </div>
                        <div class="card mt">
                            <h3>Comunicados do time:</h3>
                            <div id="coms"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <script src="../../assets/js/core/storage.js"></script>
        <script src="../../assets/js/core/auth.js"></script>
        <script src="../../assets/js/core/validacao.js"></script>
        <script src="../../assets/js/core/utils.js"></script>
        <script src="../../assets/js/components/sidebar.js"></script>
        <script src="../../assets/js/pages/atleta-painel.js"></script>
    </body>
</html>
