<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Partidas · TeamGestor</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../assets/css/variables.css" />
        <link rel="stylesheet" href="../../assets/css/reset.css" />
        <link rel="stylesheet" href="../../assets/css/base.css" />
        <link rel="stylesheet" href="../../assets/css/admin.css" />
        <link rel="stylesheet" href="../../assets/css/layout.css" />
        <link rel="stylesheet" href="../../assets/css/paginas.css" />
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="conteudo">
                <div class="topo" id="topo"></div>
                <div class="grid g4" id="resumo"></div>
                <div class="tabela" style="margin-top: 16px">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Adversário</th>
                                <th>Local</th>
                                <th>Placar</th>
                                <th>Resultado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>
                <dialog id="dlg">
                    <form id="form">
                        <h3>Registrar partida</h3>
                        <label>Adversário</label><input id="adv" required /><label>Data</label
                        ><input id="data" type="date" required /><label>Local</label
                        ><input id="local" />
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
                            <div>
                                <label>Nossos gols</label
                                ><input id="nos" type="number" min="0" required />
                            </div>
                            <div>
                                <label>Gols do adversário</label
                                ><input id="eles" type="number" min="0" required />
                            </div>
                        </div>
                        <div class="acoes">
                            <button type="button" class="btn" id="cancelar">Cancelar</button
                            ><button class="btn btn-escuro">Salvar</button>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
        <script src="../../assets/js/core/storage.js"></script>
        <script src="../../assets/js/core/auth.js"></script>
        <script src="../../assets/js/core/validacao.js"></script>
        <script src="../../assets/js/core/utils.js"></script>
        <script src="../../assets/js/components/sidebar.js"></script>
        <script src="../../assets/js/core/extras.js"></script>
        <script src="../../assets/js/pages/admin-partidas.js"></script>
    </body>
</html>
