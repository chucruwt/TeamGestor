<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Comunicados · TeamGestor</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../assets/css/variables.css" />
        <link rel="stylesheet" href="../../assets/css/reset.css" />
        <link rel="stylesheet" href="../../assets/css/base.css" />
        <link rel="stylesheet" href="../../assets/css/admin.css" />
        <link rel="stylesheet" href="../../assets/css/layout.css" />
        <link rel="stylesheet" href="../../assets/css/paginas.css" />
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="conteudo">
                <div class="topo" id="topo"></div>
                <form id="form" class="card">
                    <label style="margin-top: 0">Novo comunicado</label
                    ><textarea
                        id="msg"
                        placeholder="Escreva o aviso para o elenco"
                        required
                    ></textarea>
                    <div class="acoes">
                        <button class="btn btn-escuro">Enviar comunicado</button>
                    </div>
                </form>
                <p class="sub" style="margin: 20px 0 12px">Comunicados enviados</p>
                <div id="lista"></div>
            </main>
        </div>
        <script src="../../assets/js/core/storage.js"></script>
        <script src="../../assets/js/core/auth.js"></script>
        <script src="../../assets/js/core/validacao.js"></script>
        <script src="../../assets/js/core/utils.js"></script>
        <script src="../../assets/js/components/sidebar.js"></script>
        <script src="../../assets/js/core/extras.js"></script>
        <script src="../../assets/js/pages/admin-comunicados.js"></script>
    </body>
</html>
