<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Agenda · TeamGestor</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../assets/css/variables.css" />
        <link rel="stylesheet" href="../../assets/css/reset.css" />
        <link rel="stylesheet" href="../../assets/css/base.css" />
        <link rel="stylesheet" href="../../assets/css/admin.css" />
        <link rel="stylesheet" href="../../assets/css/layout.css" />
        <link rel="stylesheet" href="../../assets/css/paginas.css" />
    </head>
    <body>
        <div class="app">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="conteudo">
                <div class="topo" id="topo"></div>
                <div class="chips">
                    <button class="chip ativo" data-f="todos">Todos</button
                    ><button class="chip" data-f="jogo">Jogos</button
                    ><button class="chip" data-f="tatico">Treinos táticos</button
                    ><button class="chip" data-f="fisico">Treinos físicos</button>
                </div>
                <div id="lista"></div>
                <dialog id="dlg">
                    <form id="form">
                        <h3>Novo evento</h3>
                        <label>Tipo</label
                        ><select id="tipo">
                            <option value="jogo">Jogo</option>
                            <option value="tatico">Treino tático</option>
                            <option value="fisico">Treino físico</option></select
                        ><label>Título</label><input id="titulo" required /><label>Data</label
                        ><input id="data" type="date" required /><label>Horário</label
                        ><input id="hora" type="time" required /><label>Local</label
                        ><input id="local" />
                        <div class="acoes">
                            <button type="button" class="btn" id="cancelar">Cancelar</button
                            ><button class="btn btn-escuro">Salvar</button>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
        <script src="../../assets/js/core/storage.js"></script>
        <script src="../../assets/js/core/auth.js"></script>
        <script src="../../assets/js/core/validacao.js"></script>
        <script src="../../assets/js/core/utils.js"></script>
        <script src="../../assets/js/components/sidebar.js"></script>
        <script src="../../assets/js/core/extras.js"></script>
        <script src="../../assets/js/pages/admin-agenda.js"></script>
    </body>
</html>
